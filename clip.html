<!doctype html>
<html><head><meta charset="utf-8"><title>Site Works — copy files</title>
<link rel="stylesheet" href="ui.css">
<style>
  .cols{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.3fr);gap:12px}
  @media (max-width:820px){.cols{grid-template-columns:1fr}}
  .list{max-height:60vh;overflow:auto}
  .item{display:flex;gap:8px;align-items:center;padding:4px 8px;border-top:1px solid #1f2f40;cursor:pointer}
  .item:hover{background:#1f3044} .item .n{flex:1;word-break:break-all} .item .s{color:var(--dim);font-size:11px;white-space:nowrap}
  .grp{padding:6px 8px;color:#8fa3b5;background:#1b2838;font-weight:600;position:sticky;top:0}
  #drop{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--dim);margin-top:8px}
  #drop.over{border-color:var(--blue);color:#fff;background:#1f3044}
  #preview{width:100%;min-height:46vh;font-family:Consolas,Menlo,monospace;font-size:12px;white-space:pre;resize:vertical}
  .x{color:var(--bad);cursor:pointer;padding:0 4px}
</style></head>
<body><main>
  <nav class="top"><h1>Copy files to the clipboard</h1><a href="manage.html">Manage</a><a href="editor.html">New script</a></nav>
  <p class="dim">Tick scripts from your sites folder and/or add files from your computer, then copy them all as one block of text — handy for pasting into a chat, an issue or an email. One image on its own can be copied as an image.</p>
  <div class="cols">
    <div>
      <div class="bar"><input type="search" id="filter" placeholder="Filter files" style="flex:1"><button id="all">All</button><button id="none">None</button></div>
      <div class="wrap list" id="list"></div>
      <div id="drop">Drop files here, or <button id="pick">Add files from your computer…</button><input type="file" id="fileIn" multiple class="hide" style="display:none"></div>
    </div>
    <div>
      <div class="bar">
        <select id="fmt">
          <option value="md">Markdown code blocks</option>
          <option value="hdr">File headers ( // ===== path ===== )</option>
          <option value="raw">Contents only, one after another</option>
          <option value="paths">File paths only</option>
        </select>
        <select id="pathStyle"><option value="win">sites\a\b.js</option><option value="rel">a/b.js</option></select>
        <button class="go big" id="copy">Copy</button>
        <button id="copyImg" class="hide">Copy image</button>
      </div>
      <div class="dim" id="stats" style="margin-bottom:6px"></div>
      <textarea id="preview" readonly spellcheck="false"></textarea>
    </div>
  </div>
</main>
<script src="match.js"></script>
<script src="ui.js"></script>
<script src="clip.js"></script>
</body></html>
