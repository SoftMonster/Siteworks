<!doctype html>
<html><head><meta charset="utf-8"><title>Site Works</title>
<style>
  body{width:400px;margin:0;padding:12px 14px;background:#1b2838;color:#c6d4df;font:12px/1.5 "Segoe UI",Arial,sans-serif}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{margin:0;font-size:15px;color:#fff} h2{margin:12px 0 4px;font-size:12px;color:#66c0f4;text-transform:uppercase;letter-spacing:.04em}
  code{background:#0e1620;padding:1px 4px;border-radius:3px;color:#fff;word-break:break-all}
  ul{margin:0;padding-left:16px} li{margin:3px 0;word-break:break-all}
  .ok{color:#a4d007} .wait{color:#e5b84b} .bad{color:#e06c5b} .dim{color:#7a8a99}
  .tag{font-size:10px;border:1px solid #2a475e;border-radius:3px;padding:0 4px;margin-left:4px;white-space:nowrap}
  a.mini{color:#66c0f4;cursor:pointer;margin-left:6px;white-space:nowrap;font-size:11px;text-decoration:none} a.mini:hover{text-decoration:underline}
  button{background:#2a475e;color:#fff;border:0;border-radius:4px;padding:6px 8px;cursor:pointer;font:inherit;text-align:left}
  button:hover{background:#3a5f7c} button.go{background:#d18b00} button.go:hover{background:#e59a00} button:disabled{opacity:.45;cursor:default}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .hide{display:none!important}
  .switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;color:#fff;font-weight:600}
  .switch input{appearance:none;width:34px;height:18px;border-radius:9px;background:#56636f;position:relative;cursor:pointer;margin:0}
  .switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
  .switch input:checked{background:#5c7e10} .switch input:checked::after{left:18px}
  .banner{margin-top:8px;padding:6px 8px;border-radius:5px;background:#2b2f36;color:#fff}
  .site{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
  details summary{cursor:pointer;color:#66c0f4;margin-top:12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  #msg{min-height:16px;margin-top:6px}
  kbd{background:#0e1620;border:1px solid #2a475e;border-radius:3px;padding:0 4px;font-size:10px;color:#fff}
</style></head>
<body>
  <div class="top"><h1>Site Works</h1><label class="switch" title="Turn Site Works on or off everywhere"><span id="onLbl">On</span><input type="checkbox" id="on"></label></div>
  <div id="url" class="dim"></div>
  <div class="site"><span id="site"></span><button id="pause" class="hide">Pause on this site</button></div>
  <div id="banner" class="banner hide"></div>
  <h2>Scripts for this page</h2><ul id="match"></ul>
  <div class="grid">
    <button id="review" class="go hide" style="grid-column:1/-1">Review waiting request</button>
    <button id="toolbox">Open toolbox <kbd>Alt+Shift+K</kbd></button>
    <button id="newScript">New script for this page</button>
    <button id="rebuild">Rebuild index</button>
    <button id="clip">Copy files to clipboard</button>
    <button id="forgetSite">Forget this site's decisions</button>
    <button id="manage">Manage &amp; log</button>
  </div>
  <div id="msg" class="dim"></div>
  <details><summary>All scripts</summary><ul id="all"></ul><p class="dim" id="built"></p></details>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body></html>
