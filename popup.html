<!doctype html>
<html><head><meta charset="utf-8"><title>Site Works</title>
<style>
  body{width:380px;margin:0;padding:12px 14px;background:#1b2838;color:#c6d4df;font:12px/1.5 "Segoe UI",Arial,sans-serif}
  h1{margin:0 0 6px;font-size:15px;color:#fff} h2{margin:12px 0 4px;font-size:12px;color:#66c0f4;text-transform:uppercase;letter-spacing:.04em}
  code{background:#0e1620;padding:1px 4px;border-radius:3px;color:#fff;word-break:break-all}
  ul{margin:0;padding-left:16px} li{margin:3px 0;word-break:break-all}
  .ok{color:#a4d007} .wait{color:#e5b84b} .bad{color:#e06c5b} .dim{color:#7a8a99}
  .tag{font-size:10px;border:1px solid #2a475e;border-radius:3px;padding:0 4px;margin-left:4px;white-space:nowrap}
  button{background:#2a475e;color:#fff;border:0;border-radius:4px;padding:5px 10px;cursor:pointer;font:inherit}
  button:hover{background:#3a5f7c} button.go{background:#d18b00} button.go:hover{background:#e59a00}
  .bar{display:flex;gap:6px;margin-top:8px} .hide{display:none}
  details summary{cursor:pointer;color:#66c0f4;margin-top:12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
</style></head>
<body>
  <h1>Site Works</h1>
  <div id="url" class="dim"></div>
  <div id="site"></div>
  <h2>Scripts for this page</h2><ul id="match"></ul>
  <div class="bar"><button id="review" class="go hide">Review waiting request</button><button id="manage">Manage permissions &amp; log</button></div>
  <details><summary>All scripts</summary><ul id="all"></ul><p class="dim" id="built"></p></details>
  <p class="dim">Add a script: put a <code>.js</code> file in <code>sites\&lt;Site&gt;\&lt;folder&gt;\&lt;subfolder&gt;\</code>, matching the parts of the URL in order, then double-click <code>Rebuild index.cmd</code> and reload the page. New scripts ask for permission before they run.</p>
  <script src="popup.js"></script>
</body></html>
